<!-- Display the Global Strava Heatmap
Trying to get more detail by logging in -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet Map with Strava Global Heatmap Overlay</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        #map {
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
    
    
// Function to get the value of a cookie by name
function getCookieValue(name) {
    let matches = document.cookie.match(new RegExp(
        "(?:^|; )" + name.replace(/([\.$?*|{}\(\)\[\]\\\/\+^])/g, '\\$1') + "=([^;]*)"
    ));
    return matches ? decodeURIComponent(matches[1]) : undefined;
}

// Retrieve authentication parameters from cookies
const keyPairId = getCookieValue('CloudFront-Key-Pair-Id');
const policy = getCookieValue('CloudFront-Policy');
const signature = getCookieValue('CloudFront-Signature');

    // Initialize the map
    const map = L.map('map').setView([0, 0], 2);

    // Add a base layer (e.g., OpenStreetMap)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

// Ensure all necessary cookie values are present
if (!keyPairId || !policy || !signature) {
    alert('no cookies');
    
    // Add the Strava Global Heatmap overlay
    const stravaHeatmap = L.tileLayer('https://heatmap-external-{s}.strava.com/tiles/all/hot/{z}/{x}/{y}.png?px=256', {
        attribution: '© Strava',
        maxZoom: 19,
        opacity: 0.6
    }).addTo(map);

} else {

    // Construct the Strava Global Heatmap URL with authentication parameters
    const stravaHeatmapUrl = `https://heatmap-external-{s}.strava.com/tiles-auth/all/hot/{z}/{x}/{y}.png?Key-Pair-Id=${keyPairId}&Policy=${policy}&Signature=${signature}`;

    // Add the Strava Global Heatmap overlay
    const stravaHeatmap = L.tileLayer(stravaHeatmapUrl, {
        attribution: '© Strava',
        maxZoom: 19,
        opacity: 0.6
    }).addTo(map);
}

    </script>
</body>
</html>
